services:
  # Ваш додаток FastAPI
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/db

  # Prometheus - мозок моніторингу
  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  # Grafana - інтерфейс з графіками
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"

  # Експортер для PostgreSQL (стандартні метрики бази)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://user:pass@db:5432/db?sslmode=disable"

  # cAdvisor - моніторинг самих Docker контейнерів (CPU, RAM)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"